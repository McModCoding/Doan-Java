# Cấu hình khi chạy kiểm thử tự động (mvn test): cơ sở dữ liệu H2 trong bộ nhớ, không cần cài SQL Server.
# Muốn chạy kiểm thử trên SQL Server thật: đặt biến môi trường SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD trỏ tới MỘT CSDL RIÊNG cho kiểm thử (bảng sẽ bị xóa và tạo lại) - xem README.
spring.datasource.url=jdbc:h2:mem:xemay-kiem-thu;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.hikari.maximum-pool-size=20

# Socket server: cổng 0 = hệ điều hành tự chọn cổng trống, tránh đụng ứng dụng đang chạy ở 9090
xemay.socket.port=0
xemay.socket.so-client-toi-da=5
xemay.socket.thoi-gian-cho-giay=30

# Không cần dữ liệu mẫu: mỗi bài kiểm thử tự tạo dữ liệu của mình. Tắt lần quét tồn kho định kỳ cho log gọn.
xemay.du-lieu-mau=false
xemay.ton-kho.tre-lan-dau-ms=3600000
# Email chào mừng: giả lập nhanh để kiểm thử không phải chờ
xemay.email.thoi-gian-gia-lap-ms=50
