# =====================================================================
#  Profile "h2": chạy thử nhanh KHÔNG cần SQL Server (dữ liệu nằm trong bộ nhớ,
#  mất khi tắt ứng dụng). Bản nộp và buổi demo vẫn dùng SQL Server.
#
#  Cách chạy:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# =====================================================================
spring.datasource.url=jdbc:h2:mem:xemay;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Tự thêm vài xe máy mẫu để thử chức năng tồn kho và client Socket
xemay.du-lieu-mau=true
