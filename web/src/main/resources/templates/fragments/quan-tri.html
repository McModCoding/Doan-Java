<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--/*
    THANH MỤC của khu vực quản trị, đặt ở đầu mỗi trang quản trị:
      <div th:replace="~{fragments/quan-tri :: menu}"></div>
    Thành viên phụ trách hóa đơn bỏ chú thích mục của mình khi trang tương ứng đã làm xong.
*/-->
<nav th:fragment="menu" aria-label="Mục quản trị">
    <div class="tab-quan-tri nav">
        <a class="nav-link" th:href="@{/quan-tri}"
           th:classappend="${@duongDan.laTrang('/quan-tri')} ? 'active'">Tổng quan</a>
        <a class="nav-link" th:href="@{/quan-tri/xe-may}" th:classappend="${@duongDan.dangO('/quan-tri/xe-may')} ? 'active'">Xe máy</a>
        <a class="nav-link" th:href="@{/quan-tri/hang-xe}" th:classappend="${@duongDan.dangO('/quan-tri/hang-xe')} ? 'active'">Hãng xe</a>
        <a class="nav-link" th:href="@{/quan-tri/khach-hang}" th:classappend="${@duongDan.dangO('/quan-tri/khach-hang')} ? 'active'">Khách hàng</a>
        <!--/* Thành viên phụ trách hóa đơn:
        <a class="nav-link" th:href="@{/quan-tri/hoa-don}" th:classappend="${@duongDan.dangO('/quan-tri/hoa-don')} ? 'active'">Hóa đơn</a>
        */-->
        <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/quan-tri/tai-khoan}"
           th:classappend="${@duongDan.dangO('/quan-tri/tai-khoan')} ? 'active'">Tài khoản</a>
        <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/quan-tri/lich-su-dang-nhap}"
           th:classappend="${@duongDan.dangO('/quan-tri/lich-su-dang-nhap')} ? 'active'">Lịch sử đăng nhập</a>
    </div>
</nav>
</body>
</html>
