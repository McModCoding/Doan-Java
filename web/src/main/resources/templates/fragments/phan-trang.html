<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
    PHÂN TRANG dùng chung cho mọi trang danh sách. "trang" là đối tượng Page<...> lấy từ Repository.
    Các liên kết giữ nguyên từ khóa tìm kiếm, bộ lọc và cách sắp xếp đang chọn.
      <div th:replace="~{fragments/phan-trang :: phanTrang(${trang})}"></div>
*/-->
<div th:fragment="phanTrang(trang)"
     class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 mt-3">
    <div class="text-body-secondary small" th:if="${trang.totalElements > 0}"
         th:text="|Hiển thị ${trang.number * trang.size + 1}–${trang.number * trang.size + trang.numberOfElements} trên tổng ${trang.totalElements}|">
        Hiển thị 1–10 trên tổng 25
    </div>

    <nav th:if="${trang.totalPages > 1}" aria-label="Phân trang"
         th:with="batDau=${trang.number - 2 > 0 ? trang.number - 2 : 0},
                  ketThuc=${trang.number + 2 < trang.totalPages - 1 ? trang.number + 2 : trang.totalPages - 1}">
        <ul class="pagination pagination-sm flex-wrap mb-0">
            <li class="page-item" th:classappend="${trang.first} ? 'disabled'">
                <a class="page-link" th:with="lienKet=${@duongDan.thay('page', 1)}" th:href="${lienKet}" aria-label="Trang đầu">&laquo;</a>
            </li>
            <li class="page-item" th:classappend="${trang.first} ? 'disabled'">
                <a class="page-link" th:with="lienKet=${@duongDan.thay('page', trang.number)}" th:href="${lienKet}" aria-label="Trang trước">&lsaquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(batDau, ketThuc)}"
                th:classappend="${i == trang.number} ? 'active'">
                <a class="page-link" th:with="lienKet=${@duongDan.thay('page', i + 1)}" th:href="${lienKet}" th:text="${i + 1}"
                   th:attr="aria-current=${i == trang.number} ? 'page'">1</a>
            </li>
            <li class="page-item" th:classappend="${trang.last} ? 'disabled'">
                <a class="page-link" th:with="lienKet=${@duongDan.thay('page', trang.number + 2)}" th:href="${lienKet}" aria-label="Trang sau">&rsaquo;</a>
            </li>
            <li class="page-item" th:classappend="${trang.last} ? 'disabled'">
                <a class="page-link" th:with="lienKet=${@duongDan.thay('page', trang.totalPages)}" th:href="${lienKet}" aria-label="Trang cuối">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
