<!DOCTYPE html>
<!--/*
    BỐ CỤC DÙNG CHUNG cho mọi trang: <head>, header + menu, vùng thông báo, footer, hộp xác nhận, script.
    Quy chuẩn giao diện: xem docs/quy-chuan-giao-dien.md.

    Cách dùng trong một trang (đặt nội dung trang vào một thẻ <section> duy nhất):

    <!DOCTYPE html>
    <html lang="vi" xmlns:th="http://www.thymeleaf.org"
          th:replace="~{fragments/layout :: trang(~{::title}, ~{::section})}">
    <head><title th:text="'Tên trang | ' + #{cuahang.ten}">Tên trang | Web Xe Máy</title></head>
    <body>
    <section> ... nội dung trang ... </section>
    </body>
    </html>
*/-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="trang(tieuDe, noiDung)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${tieuDe}">Web Xe Máy</title>
    <meta name="theme-color" content="#16181D">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/fonts/be-vietnam-pro/be-vietnam-pro.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/motostore-frontend.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-sm btn-outline-secondary" href="#noi-dung">Bỏ qua menu</a>

<header th:replace="~{fragments/header :: header}"></header>

<main id="noi-dung" class="flex-grow-1 noi-dung-chinh">
    <div class="container">
        <!-- Trang đăng nhập, đăng ký tự hiển thị thông báo ngay trên form -->
        <th:block th:unless="${anThongBaoChung}">
            <div th:replace="~{fragments/thong-bao :: thongBao}"></div>
        </th:block>
        <th:block th:replace="${noiDung}"></th:block>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/xac-nhan :: hopXacNhan}"></div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
