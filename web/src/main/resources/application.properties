# =====================================================================
#  CẤU HÌNH CHUNG CỦA ỨNG DỤNG WEB XE MÁY
#  Mật khẩu SQL Server của mỗi máy khác nhau -> KHÔNG sửa trực tiếp ở đây,
#  hãy tạo file application-local.properties (xem mục 1).
# =====================================================================
spring.application.name=xemay-web
server.port=8080

# ---------- 1. Kết nối SQL Server ----------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyXeMay;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
# Mỗi thành viên tạo file src/main/resources/application-local.properties (đã nằm trong .gitignore)
# để ghi đè username/password theo máy mình. Không có file này thì dùng giá trị ở trên.
spring.config.import=optional:classpath:application-local.properties

# ---------- 2. JPA / Hibernate ----------
# update: tự thêm bảng/cột còn thiếu theo Entity. Khi script SQL đã ổn định thì đổi thành "validate"
# để bảo đảm Entity khớp đúng với script nộp bài.
spring.jpa.hibernate.ddl-auto=update
# Mọi cột chuỗi dùng NVARCHAR để lưu tiếng Việt có dấu trên SQL Server
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- 3. Phân trang (dùng tham số ?page=1&size=10&sort=ten,asc) ----------
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ---------- 4. Phiên đăng nhập ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax

# ---------- 5. Đa luồng: đặt tên luồng để nhìn thấy trong log khi demo ----------
# Luồng chạy tác vụ nền (@Async)
spring.task.execution.thread-name-prefix=xemay-nen-
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=200
# Luồng chạy tác vụ định kỳ (@Scheduled)
spring.task.scheduling.thread-name-prefix=xemay-dinh-ky-
spring.task.scheduling.pool.size=2

# ---------- 6. Tham số nghiệp vụ ----------
# Đăng nhập: sai quá số lần này thì tạm khóa
xemay.dang-nhap.so-lan-sai-toi-da=5
xemay.dang-nhap.thoi-gian-khoa-phut=15
# Lịch sử đăng nhập: tự xóa bản ghi cũ hơn số ngày này (chạy lúc 02:00 mỗi ngày)
xemay.lich-su-dang-nhap.so-ngay-luu=90
# Tồn kho: xe còn <= ngưỡng này được coi là sắp hết hàng; chu kỳ quét tính bằng mili giây
xemay.ton-kho.nguong-canh-bao=3
xemay.ton-kho.chu-ky-quet-ms=60000

# ---------- 7. Socket server cho chương trình client quản lý kho ----------
xemay.socket.enabled=true
xemay.socket.port=9090
xemay.socket.so-client-toi-da=10
# Client không gửi lệnh nào trong khoảng thời gian này (giây) thì server tự ngắt kết nối
xemay.socket.thoi-gian-cho-giay=300

# ---------- 8. Dữ liệu mẫu ----------
# true: tự thêm vài xe máy mẫu khi bảng xe_may còn trống (chỉ dùng để chạy thử phần tồn kho)
xemay.du-lieu-mau=false
